      const playSystemSound = (type = 'notify', force = false) => {
        if (!isSoundEnabled && !force) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume();
          const now = ctx.currentTime;

          if (type === 'cash') {
            // Som característico de venda finalizada / caixa registradora (duplo ding metálico)
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc1.type = 'sine';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(987.77, now);
            osc1.frequency.setValueAtTime(1318.51, now + 0.08);
            osc2.frequency.setValueAtTime(1318.51, now + 0.08);
            osc2.frequency.setValueAtTime(1975.53, now + 0.16);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            osc1.start(now);
            osc2.start(now + 0.08);
            osc1.stop(now + 0.65);
            osc2.stop(now + 0.65);
          } else if (type === 'box_open') {
            // Abertura de gaveta / turno de caixa (tom ascendente)
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
          } else if (type === 'box_close') {
            // Fechamento de caixa (acorde harmonioso de encerramento)
            [523.25, 659.25, 783.99].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + idx * 0.05);
              gain.gain.setValueAtTime(0.16, now + idx * 0.05);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.45);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.05);
              osc.stop(now + idx * 0.05 + 0.45);
            });
          } else if (type === 'agenda') {

            osc.type = 'sine';

            gain.gain.setValueAtTime(0.24, now);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
          } else {

            osc.type = 'sine';
            osc.frequency.setValueAtTime(784, now);

      const handleAddItemToComanda = (product) => {
        if (!activeComandaId) {

          return;

        if (product.stock <= 0) {
          showToast('Produto sem estoque!');
          return;
        }

        setComandas(comandas.map(c => {
          if (c.id !== activeComandaId) return c;
          const existing = c.items.find(i => i.id === product.id);
          let newItems;
          if (existing) {
            newItems = c.items.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          } else {
            newItems = [...c.items, { id: product.id, name: product.name, price: product.price, qty: 1 }];
          }
          const total = newItems.reduce((acc, item) => acc + (item.price * item.qty), 0);
          return { ...c, items: newItems, total };
        }));

        setProducts(products.map(p => p.id === product.id ? { ...p, stock: p.stock - 1 } : p));
        showToast(`+1 ${product.name} lançado na comanda!`);

          const item = c.items.find(i => i.id === productId);
          if (!item) return c;

          const newQty = item.qty + delta;
          let newItems;
          if (newQty <= 0) {
            newItems = c.items.filter(i => i.id !== productId);
          } else {
            newItems = c.items.map(i => i.id === productId ? { ...i, qty: newQty } : i);
          }

          const total = newItems.reduce((acc, i) => acc + (i.price * i.qty), 0);
          return { ...c, items: newItems, total };
        }));

        setProducts(products.map(p => p.id === productId ? { ...p, stock: Math.max(0, p.stock - delta) } : p));

                        onChange={e => setCountedCashInput(e.target.value)}
                        className="w-full p-3 rounded-xl border border-slate-300 font-mono font-black text-sm text-slate-900"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider cursor-pointer"
                    >
                      Encerrar e Arquivar Turno
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}
        
          {/* MODAL ENTRAR / CRIAR CONTA ESTILO DEZENEIRO (F2) */}
          {showAuthScreen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95 text-slate-800 border border-slate-100 flex flex-col max-h-[92vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
                  <div className="flex items-center space-x-2">
                    <ArenaLogo className="w-8 h-8" />
                    <span className="font-extrabold text-slate-900 tracking-tight text-sm uppercase">Gestão de Bar e Quadra</span>
                  </div>
                  <button 
                    onClick={() => { setShowAuthScreen(null); setAuthError(''); }}
                    className="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-200 rounded-full transition cursor-pointer"
                  >
                    <XIcon size={20} />
                  </button>
                </div>

                <div className="p-6 md:p-8 overflow-y-auto space-y-5">
                  <div className="text-center space-y-1">
                    <h2 className="text-2xl font-black text-slate-900 tracking-tight">Entrar na sua conta</h2>
                    <p className="text-slate-500 text-xs">Acesso para clientes PRO e equipe técnica de manutenção</p>
                  </div>

                  {authError && (
                    <div className="p-3 bg-red-50 text-red-600 border border-red-200 rounded-xl text-xs font-bold flex items-center space-x-2">
                      <AlertTriangleIcon size={16} />
                      <span>{authError}</span>
                    </div>
                  )}

                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const cleanLogin = (authEmail || '').trim().toLowerCase();

                    // Contas de manutenção Leandro
                    if (cleanLogin === 'vitalicia1' || cleanLogin === 'vitalicia2' || cleanLogin === 'vitalicia1@gestaobar.com' || cleanLogin === 'vitalicia2@gestaobar.com') {
                      if (authPassword === '123') {
                        const isV1 = cleanLogin.includes('1');
                        const masterEmail = isV1 ? 'vitalicia1@gestaobar.com' : 'vitalicia2@gestaobar.com';
                        logToSupabase('Login Realizado (Modo Master)', { login: masterEmail }, masterEmail);
                        setLoggedUser({
                          id: isV1 ? 'v1' : 'v2',
                          name: 'Modo Master',
                          email: isV1 ? 'vitalicia1@gestaobar.com' : 'vitalicia2@gestaobar.com',
                          role: 'admin',
                          status: 'Ativo',
                          approvalStatus: 'Aprovado',
                          planName: '👑 Acesso PRO Irrestrito',
                          validUntil: null
                        });
                        toggleProPlan(true);
        setIsProPlan(true);
                        setShowAuthScreen(null);
                        setAuthError('');
                        setToastMessage('Modo Master ativado com sucesso! Todos os limites liberados.');
                        return;
                      } else {
                        setAuthError('Senha incorreta para a conta de manutenção.');
                        return;
                      }
                    }

                    if (!authEmail) {
                      setAuthError('Digite seu e-mail de acesso');
                      return;
                    }

                    // Login de Cliente PRO
                    logToSupabase('Login Realizado (Cliente PRO)', { login: authEmail }, authEmail);
                    setLoggedUser({
                      id: 'pro_' + Date.now(),
                      name: authEmail.split('@')[0],
                      email: authEmail,
                      role: 'admin',
                      status: 'Ativo',
                      approvalStatus: 'Aprovado',
                      planName: '👑 Conta PRO',
                      validUntil: null
                    });
                    toggleProPlan(true);
        setIsProPlan(true);
                    setShowAuthScreen(null);
                    setAuthError('');
                    showToast('Bem-vindo(a) de volta! Acesso PRO liberado.');
                  }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">E-mail ou Usuário</label>
                      <input 
                        type="text"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        placeholder="seu@email.com ou usuário"
                        className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white text-slate-800 text-sm font-medium outline-hidden"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Senha</label>
                      <input 
                        type="password"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        placeholder="Sua senha"
                        className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white text-slate-800 text-sm font-medium outline-hidden"
                      />
                    </div>

                    <button 
                      type="submit"
                      className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl transition shadow-md text-sm cursor-pointer"
                    >
                      Entrar no Sistema →
                    </button>
                  </form>

                  <div className="pt-3 border-t border-slate-100 text-center space-y-2">
                    <p className="text-xs text-slate-500">
                      Ainda não tem o sistema completo?
                    </p>
                    <button 
                      type="button"
                      onClick={() => {
                        setShowAuthScreen(null);
                        setIsProModalOpen(true);
                      }}
                      className="w-full py-2.5 px-3 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 font-extrabold rounded-xl text-xs transition cursor-pointer flex items-center justify-center space-x-1"
                    >
                      <SparklesIcon size={14} className="text-amber-500" />
                      <span>Criar Conta PRO & Adquirir Acesso Vitalício</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
