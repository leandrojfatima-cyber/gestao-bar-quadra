            else if (m.method === 'PIX') pixTotal += m.amount;
            else if (m.method === 'Cartão') cardTotal += m.amount;

            newItems = c.items.filter(i => i.id !== productId);

            newItems = c.items.map(i => i.id === productId ? { ...i, qty: newQty } : i);

          description: `Fechamento ${cmd.name}`,
          amount: totalAmount,
